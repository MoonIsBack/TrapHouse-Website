<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TrapHouse">
  <defs>
    <linearGradient id="th" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2f92" />
      <stop offset="1" stop-color="#b026ff" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#0b070a" />

  <!-- Dach: ein einfaches Haus-Dreieck, das das "House" im Namen aufgreift -->
  <path d="M32 12 54 30 46 30 32 20 18 30 10 30 Z" fill="url(#th)" />

  <!-- Das T darunter, in derselben blockigen Anmutung wie die Überschriften -->
  <rect x="18" y="34" width="28" height="7" rx="2" fill="url(#th)" />
  <rect x="28.5" y="34" width="7" height="20" rx="2" fill="url(#th)" />
</svg>
