name: Deploy TrapHouse to GitHub Pages

on:
  push:
    branches: [main]

  # Erlaubt es, den Deploy auf GitHub von Hand zu starten:
  # Actions → "Deploy TrapHouse to GitHub Pages" → "Run workflow".
  #
  # Praktisch, wenn sich am Code nichts geändert hat, aber trotzdem neu
  # veröffentlicht werden muss — etwa nachdem GitHub Pages neu eingerichtet
  # wurde. Ohne diesen Eintrag bräuchte es dafür jedes Mal einen Commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
