<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <!-- Der Pfad beginnt mit einem einzelnen /: Vite setzt beim Bauen den
         "base"-Wert aus vite.config.js automatisch davor. Schreibt man ihn
         hier selbst mit hin, steht er am Ende doppelt in der Adresse. -->
    <!-- Das originale TrapHouse-Schriftlogo in mehreren Formaten. Komplett
         neue v4-Dateinamen umgehen die Favicon-Datenbank des Browsers. -->
    <link rel="icon" type="image/x-icon" href="/traphouse-favicon-v4.ico">
    <link rel="shortcut icon" type="image/x-icon" href="/traphouse-favicon-v4.ico">
    <link rel="icon" type="image/png" sizes="512x512" href="/traphouse-favicon-v3.png?v=4">
    <link rel="apple-touch-icon" sizes="512x512" href="/traphouse-favicon-v3.png?v=4">
    <link rel="manifest" href="/site.webmanifest?v=4">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TrapHouse | Deine Musik Community</title>
    <meta name="application-name" content="TrapHouse">
    <meta name="apple-mobile-web-app-title" content="TrapHouse">
    <meta
      name="description"
      content="TrapHouse ist die deutschsprachige Community für Artists und Producer: Discord-Server, Merch und alles rund um deine Musik."
    />

    <!-- Vorschau-Karte beim Teilen (WhatsApp, Discord, Instagram-DM) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TrapHouse" />
    <meta property="og:description" content="Die Musik-Community für Artists & Producer." />
    <meta name="theme-color" content="#0b070a" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
